name: Build HarmonyVoices Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # <--- ICI : On utilise un serveur Mac
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Configure CMake
      # On compile pour Intel (x86_64) ET Apple Silicon (arm64)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HarmonyVoices-MAC-VST3
        path: build/HarmonyVoices_artefacts/Release/VST3/HarmonyVoices.vst3
